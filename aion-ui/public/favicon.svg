<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Octahedron / diamond seed icon -->
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#8b7aff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a52e0"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
  </defs>
  <!-- Top facet -->
  <polygon points="16,2 28,12 16,16 4,12" fill="url(#g1)" opacity="0.9"/>
  <!-- Bottom-left facet -->
  <polygon points="4,12 16,16 16,30 4,20" fill="url(#g2)" opacity="0.7"/>
  <!-- Bottom-right facet -->
  <polygon points="28,12 16,16 16,30 28,20" fill="url(#g1)" opacity="0.5"/>
  <!-- Core glow -->
  <circle cx="16" cy="16" r="2" fill="#ffffff" opacity="0.8"/>
</svg>
