<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AION — Connecting...</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0b0c12;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo svg {
      width: 48px;
      height: 48px;
      margin-bottom: 0.75rem;
    }
    .logo h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .logo .accent { color: #6c63ff; }
    .logo p { color: #5a5a70; font-size: 0.85rem; margin-top: 0.25rem; }
    .card {
      background: #12131c;
      border: 1px solid #2a2d45;
      border-radius: 10px;
      padding: 1.5rem;
    }
    .card h2 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #8a8aa0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
      text-align: center;
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block; font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: #5a5a70; margin-bottom: 0.3rem;
    }
    .field input {
      width: 100%; padding: 0.6rem 0.75rem;
      background: #1a1b28; border: 1px solid #2a2d45;
      border-radius: 6px; color: #e8e8f0; font-size: 0.9rem;
      font-family: inherit; transition: border-color 0.15s;
    }
    .field input:focus { outline: none; border-color: #6c63ff; }
    .error {
      background: rgba(239,83,80,0.08);
      border: 1px solid rgba(239,83,80,0.3);
      color: #ef5350; padding: 0.5rem 0.75rem;
      border-radius: 6px; font-size: 0.8rem; margin-bottom: 1rem;
      display: none;
    }
    .error.show { display: block; }
    button {
      width: 100%; padding: 0.65rem; background: #6c63ff;
      border: none; border-radius: 6px; color: white;
      font-size: 0.9rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #7b73ff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { text-align: center; margin-top: 1rem; font-size: 0.75rem; color: #5a5a70; }
    .hint code { color: #6c63ff; background: rgba(108,99,255,0.1); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.7rem; }

    /* Auto-login spinner */
    .spinner { text-align: center; padding: 1.5rem 0; }
    .spinner .ring {
      display: inline-block; width: 32px; height: 32px;
      border: 3px solid #2a2d45; border-top: 3px solid #6c63ff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner p { margin-top: 0.75rem; color: #5a5a70; font-size: 0.85rem; }
    .spinner .token-path {
      font-size: 0.7rem; color: #3a3a50; margin-top: 0.5rem;
      word-break: break-all; font-family: 'Courier New', monospace;
    }
    .auto-login-fail { display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6c63ff"/>
            <stop offset="100%" stop-color="#8b7aff"/>
          </linearGradient>
        </defs>
        <polygon points="16,2 28,12 16,16 4,12" fill="url(#lg)" opacity="0.9"/>
        <polygon points="4,12 16,16 16,30 4,20" fill="url(#lg)" opacity="0.6"/>
        <polygon points="28,12 16,16 16,30 28,20" fill="url(#lg)" opacity="0.35"/>
        <circle cx="16" cy="16" r="2" fill="white" opacity="0.85"/>
      </svg>
      <h1>A<span class="accent">ION</span></h1>
      <p>Agent Swarm OS</p>
    </div>

    <div class="card" id="autoLoginCard">
      <div class="spinner" id="spinner">
        <div class="ring"></div>
        <p>Connecting...</p>
        <p class="token-path" id="tokenPath"></p>
      </div>
    </div>

    <div class="card auto-login-fail" id="loginCard">
      <h2>Sign In</h2>
      <div class="error" id="error"></div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="admin" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
      </div>
      <button id="loginBtn" onclick="login()">Sign In</button>
    </div>

    <div class="hint">
      Token stored at <code>~/.aion/aion-token.txt</code>
    </div>
  </div>

  <script>
    // Try auto-login immediately on page load
    (async function() {
      try {
        const res = await fetch('/api/auto-login');
        const data = await res.json();

        if (data.ok && data.token) {
          // Show path
          document.getElementById('tokenPath').textContent = data.path || 'Token saved';
          
          // Store token in localStorage and cookie
          localStorage.setItem('aion_token', data.token);
          document.cookie = `aion_token=${data.token}; path=/; max-age=2592000; SameSite=Strict`;

          // Brief pause so user sees it worked, then redirect
          await new Promise(r => setTimeout(r, 600));
          window.location.href = '/dashboard';
          return;
        }

        // Auto-login failed, show manual login form
        showLoginForm(data.error || 'Auto-login unavailable');
      } catch (err) {
        // Auto-login failed, show manual login
        showLoginForm('Could not auto-login. Enter credentials.');
      }
    })();

    function showLoginForm(errorText) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      if (errorText) {
        const err = document.getElementById('error');
        err.textContent = errorText;
        err.classList.add('show');
      }
    }

    async function login() {
      const username = document.getElementById('username').value.trim() || 'admin';
      const password = document.getElementById('password').value.trim() || 'aion';
      const btn = document.getElementById('loginBtn');
      const error = document.getElementById('error');

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      error.classList.remove('show');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.ok && data.token) {
          localStorage.setItem('aion_token', data.token);
          document.cookie = `aion_token=${data.token}; path=/; max-age=2592000; SameSite=Strict`;
          window.location.href = '/dashboard';
        } else {
          error.textContent = data.error || 'Login failed';
          error.classList.add('show');
        }
      } catch (err) {
        error.textContent = 'Connection failed. Is the server running?';
        error.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
    document.getElementById('username').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
